<title>中文</title>
<!-- Generated by app/build.py from app/shell.html, app/core.js, app/ui.js and daten/saetze.json. Do not edit. -->
<style>
:root{--ok-ink:#fff;--bg:#f6f4ef;--panel:#fff;--ink:#1d2129;--muted:#6b7280;--line:#e4e1d8;--accent:#b91c1c;--accent-ink:#fff;--ok:#1f9d55;--again:#c2410c;--miss:#dc2626;--soft:#f8efe9;--shadow:0 1px 2px rgba(0,0,0,.06)}
@media (prefers-color-scheme:dark){:root{--ok-ink:#062b1d;--bg:#16181c;--panel:#1f2228;--ink:#eceef2;--muted:#9aa1ad;--line:#2f333b;--accent:#f87171;--accent-ink:#2a0b0b;--ok:#34d399;--again:#fb923c;--miss:#f87171;--soft:#2d1c1c;--shadow:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  padding:max(14px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto}
section{display:none}section.on{display:block}
header{margin:6px 0 14px}h1{font-size:26px;margin:0;letter-spacing:-.01em}h2{font-size:21px;margin:2px 0 6px}
.sub,.muted{color:var(--muted);font-size:15px}
.kicker{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.panel,.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 12px;box-shadow:var(--shadow)}
.panel p{margin:6px 0}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:12px 16px;font:inherit;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{width:100%;min-height:56px;font-size:18px;margin-top:8px}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--ok-ink)}
.btn.again{background:transparent;border-color:var(--again);color:var(--again)}
.btn.easy{background:transparent;border-color:var(--ok);color:var(--ok)}
.link{background:none;border:0;color:var(--accent);font:inherit;font-weight:600;padding:6px 0;cursor:pointer}
.link.undo{padding:6px 0 6px 6px;font-size:15px}
.tile{flex-direction:column;align-items:flex-start;text-align:left;min-height:72px;padding:12px 14px}
.tile small{font-weight:400;color:var(--muted);font-size:13px;line-height:1.3}
.tile.wide{width:100%;margin-bottom:10px}
footer{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:8px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.icon{background:none;border:0;color:var(--ink);padding:6px;margin-left:-6px;cursor:pointer;display:inline-flex}
.icon svg{width:26px;height:26px}
.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.zh{font-size:24px;line-height:1.45;font-weight:600;margin:6px 0 4px}
.zh.big{font-size:30px;margin:10px 0 6px}
.zh.s{font-size:18px;margin:0}
.zh mark{background:none;color:var(--accent);text-decoration:underline 2px;text-underline-offset:5px}
.meaning{font-size:17px;margin-top:6px}.meaning.big{font-size:22px;font-weight:600;margin:10px 0 6px}.meaning.s{font-size:15px;color:var(--muted);margin:0}
.words{margin-top:12px;border-top:1px solid var(--line)}
.wd{display:grid;grid-template-columns:auto auto 1fr;gap:4px 10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line)}
.wd b{font-size:19px}.wd .py{color:var(--accent);font-size:15px}.wd span:last-child{font-size:15px;color:var(--muted)}
.hint{color:var(--muted);font-size:15px}
.notes{background:var(--soft);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:15px}
.rate{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:8px;margin-top:14px}.rate .btn{min-height:58px;font-size:18px}
.dots{display:flex;gap:8px;margin:6px 0 4px}
.dot{display:flex;flex-direction:column;align-items:center;gap:2px}
.dot span{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:15px}
.dot span.ok{background:var(--ok);border-color:var(--ok);color:var(--ok-ink)}.dot span.miss{background:var(--miss);border-color:var(--miss)}
.dot small{font-size:11px;color:var(--muted)}.dot small.now{color:var(--ink);font-weight:700}
.row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.rt{flex:1;min-width:0}
.tag{font-size:11px;border-radius:8px;padding:2px 7px;background:var(--line);color:var(--muted);white-space:nowrap}
.tag.sure{background:var(--ok);color:var(--ok-ink)}.tag.learning{background:var(--soft);color:var(--accent)}
input[type=search]{width:100%;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 6px}
.form label{display:block;font-weight:600;font-size:15px;margin-bottom:12px}
body.banner{padding-bottom:calc(90px + env(safe-area-inset-bottom))}
#update{display:none;position:fixed;left:16px;right:16px;bottom:max(16px,env(safe-area-inset-bottom));background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:14px;text-align:center;font-weight:600;cursor:pointer;z-index:9}
</style>
